name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "📦 SkillOps NPX Core Engine & CLI Features"
    labels:
      - "📦 core-engine"
      - "scope: core-engine"
      - "✨ feat"
  - title: "🧠 Hybrid Executable Skill & Subagent Catalog"
    labels:
      - "🧠 skill-catalog"
  - title: "🧪 Zero-API TDD Evaluation & Benchmark Engine"
    labels:
      - "🧪 eval-benchmark"
  - title: "🔄 Context-Aware Router & Multi-Runtime Sync"
    labels:
      - "🔄 multi-runtime"
      - "🔌 mcp-server"
  - title: "🔴 Core AI Architecture & Agent Rules"
    labels:
      - "🔴 core-architecture"
      - "⚠️ agent-behavior"
  - title: "🐛 Bug Fixes"
    labels:
      - "🐛 fix"
  - title: "♻️ Refactoring & Internal Improvements"
    labels:
      - "♻️ refactor"
  - title: "🔒 Security & SAST Guardrails"
    labels:
      - "🔒 security"
  - title: "📄 Documentation & ADRs"
    labels:
      - "📄 docs"
  - title: "⚙️ CI/CD & DevOps Governance"
    labels:
      - "⚙️ ci"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - "breaking"
  minor:
    labels:
      - "✨ feat"
      - "🧠 skill-catalog"
  patch:
    labels:
      - "🐛 fix"
      - "📄 docs"
      - "⚙️ ci"
      - "♻️ refactor"
  default: patch
template: |
  ## What's Changed

  $CHANGES

  ---
  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
