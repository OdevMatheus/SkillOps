name: "SkillOps Multi-Runtime Catalog Verification Gate"
description: "Verifies that all catalog Skills (SKILL.md) and Subagents (SUBAGENT.md) transpile cleanly across all 28 supported AI coding IDEs and CLIs."
author: "OdevMatheus"
branding:
  icon: "shield"
  color: "purple"

inputs:
  catalog-path:
    description: "Path to the Skill & Subagent catalog directory."
    required: false
    default: "catalog"
  targets:
    description: "Target AI harnesses to verify (default: all)."
    required: false
    default: "all"
  node-version:
    description: "Node.js version used to run SkillOps CLI (requires >= 20)."
    required: false
    default: "22"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Verify Multi-Runtime Transpilation (Dry-Run)
      shell: bash
      run: |
        if [ -f "dist/cli.js" ]; then
          SKILLOPS_CMD="node dist/cli.js"
        else
          SKILLOPS_CMD="npx --yes skillops-cli@latest"
        fi
        $SKILLOPS_CMD add --all --catalog "${{ inputs.catalog-path }}" --targets "${{ inputs.targets }}" --dry-run
