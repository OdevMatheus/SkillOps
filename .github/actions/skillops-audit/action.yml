name: "SkillOps Audit (Zero-API NPX Token Economy & Collision Gate)"
description: "Audits AI Coding Agent Skills & Context-Isolated Subagents for Startup Token Tax, L1/L2/L3 progressive disclosure budgets, and semantic collisions."
author: "OdevMatheus"
branding:
  icon: "shield"
  color: "blue"

inputs:
  catalog-path:
    description: "Path to the Hybrid Executable Skill & Subagent catalog directory."
    required: false
    default: "catalog"
  strict:
    description: "Fail on high-risk semantic collisions (cosine >= 0.72)."
    required: false
    default: "true"
  node-version:
    description: "Node.js version used to run SkillOps NPX engine (requires >= 20)."
    required: false
    default: "22"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run SkillOps NPX Semantic Collision & Token Budget Audit
      shell: bash
      run: |
        STRICT_FLAG=""
        if [ "${{ inputs.strict }}" = "true" ]; then
          STRICT_FLAG="--strict"
        fi
        npx skillops@latest audit --catalog "${{ inputs.catalog-path }}" --format table $STRICT_FLAG
