name: "SkillOps Multi-Runtime Catalog Verification Gate"
description: "Verifies that all catalog Skills (SKILL.md) and Subagents (SUBAGENT.md) transpile cleanly across all 28 supported AI coding IDEs and CLIs."
author: "OdevMatheus"
branding:
  icon: "shield"
  color: "purple"

inputs:
  catalog-path:
    description: "Path to the Skill & Subagent catalog directory."
    required: false
    default: "catalog"
  targets:
    description: "Target AI harnesses to verify (default: all)."
    required: false
    default: "all"
  node-version:
    description: "Node.js version used to run SkillOps CLI (requires >= 20)."
    required: false
    default: "22"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Verify Multi-Runtime Transpilation (Dry-Run)
      shell: bash
      env:
        INPUT_CATALOG_PATH: ${{ inputs.catalog-path }}
        INPUT_TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        if [[ -f "./dist/cli.js" ]]; then
          node ./dist/cli.js add --all --catalog "$INPUT_CATALOG_PATH" --targets "$INPUT_TARGETS" --dry-run
        else
          npx --yes skillops-cli add --all --catalog "$INPUT_CATALOG_PATH" --targets "$INPUT_TARGETS" --dry-run
        fi
