name: Feature or Hybrid Skill Request
description: Propose a new SkillOps CLI capability, runtime adapter, or benchmark-verified Hybrid Executable Skill
title: "feat: "
labels: ["✨ feat"]
body:
  - type: checkboxes
    id: search
    attributes:
      label: Existing Issues
      options:
        - label: I have searched existing issues and discussions to ensure this hasn't been proposed yet.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Engineering Problem or Failure Mode
      description: What failure mode (e.g., routing collision, baseline agent failure, runtime sync gap) does this solve?
      placeholder: "e.g., Baseline coding agents frequently introduce event-loop blocking calls inside FastAPI async endpoints..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Hybrid Skill Specification
      description: Describe how this should work in SkillOps (including deterministic Python script and TDD eval assertions if proposing a skill).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches or workarounds you've considered?
