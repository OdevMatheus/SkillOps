name: "✨ Core Solution Feature Proposal (Track B — Issue Required)"
description: "Propose an improvement to the Core CLI (add/remove), Lip Gloss TUI, or 28-IDE transpiler (Not required for new catalog Skills/Subagents)"
title: "feat: "
labels: ["✨ feat"]
body:
  - type: markdown
    attributes:
      value: |
        > 💡 **Adding a new Skill (`SKILL.md`) or Subagent (`SUBAGENT.md`) to `catalog/`?**
        > You do **not** need to open an Issue! Follow [`CONTRIBUTING.md`](https://github.com/OdevMatheus/SkillOps/blob/master/CONTRIBUTING.md) (**Track A**) and open a Pull Request directly.
        >
        > Use this template for **Track B (Core Solution)** changes (`src/`, `.github/`, new AI IDE adapters, or TUI improvements).
  - type: dropdown
    id: category
    attributes:
      label: Proposal Category
      options:
        - "Core CLI & Interactive TUI (src/cli.ts, src/ui/)"
        - "New or Updated AI IDE / CLI Runtime Adapter (src/sync/adapters.ts)"
        - "Lockfile & SHA-256 Sync Engine (src/sync/)"
        - "Catalog Schema & Manifest Contract (src/models.ts, SKILL_CONTRACT.md)"
        - "CI/CD, Release Automation & Open-Source Governance (.github/)"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement & Motivation
      description: What developer friction or limitation in the current add/remove workflow does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Design
      description: Describe the proposed change and how it fits within the lean SkillOps MVP.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: List verifiable criteria and unit/integration test expectations (`npm test`).
    validations:
      required: true
