name: Feature / Hybrid Skill / Subagent Proposal
description: Propose a new Hybrid Executable Skill, Context-Isolated Subagent, NPX CLI capability, or runtime adapter for SkillOps
title: "feat: "
labels: ["✨ feat"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Proposal Category
      options:
        - Core Engine Feature (src/ — Auditor / Token Economy / Router / Sync / Eval / MCP)
        - New Hybrid Executable Skill — Track 1: AI & Agentic Engineering (catalog/ai-engineering/)
        - New Hybrid Executable Skill — Track 2: Python 3.12+ Backend (catalog/python-backend/)
        - New Hybrid Executable Skill — Track 3: Architecture, Security & Quality (catalog/arch-quality/)
        - New Context-Isolated Subagent (catalog/subagents/ or .github/agents/)
        - Multi-Runtime Adapter (Claude Code / Antigravity / Cursor / Codex CLI / GitHub Copilot)
        - Architecture Decision Record (ADR) / Governance Enhancement
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement & Empirical Motivation
      description: What failure mode, routing collision, token waste, or engineering bottleneck does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Design & Deterministic Execution Contract
      description: Describe the TypeScript/Node.js 20+ module or Hybrid Skill (`SKILL.md` + `scripts/*.py --json` + `evals/evals.json`) or Subagent (`AGENT.md` with `max_output_tokens <= 400`).
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria (EARS / TDD Assertions)
      description: List verifiable criteria, token budget bounds, and expected pass-rate delta (`with_skill` vs `without_skill`).
    validations:
      required: true
