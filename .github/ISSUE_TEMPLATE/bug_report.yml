name: Bug Report
description: Report a bug or unexpected behavior in FolioOps
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **Privacy First:** Never include personal portfolio data, emails, phone numbers, or local machine paths in public issues.
  - type: checkboxes
    id: search
    attributes:
      label: Existing Issues
      options:
        - label: I have searched existing issues to make sure this bug has not been reported yet.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Provide a clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue step by step?
      placeholder: |
        1. Open repository in...
        2. Run command / prompt...
        3. See error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: AI Agent / IDE Used
      placeholder: "e.g., Antigravity, Claude Code, Cursor, GitHub Copilot"
  - type: input
    id: environment
    attributes:
      label: OS & Environment
      placeholder: "e.g., Windows 11 / macOS 15 / Ubuntu 24.04"
