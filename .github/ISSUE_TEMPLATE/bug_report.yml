name: "🐛 Bug Report (Core CLI / Transpiler / Catalog)"
description: "Report a bug in skillops add, skillops remove, the Lip Gloss TUI, or one of the 28 AI IDE/CLI transpilers"
title: "fix: "
labels: ["🐛 fix"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue in **SkillOps**!
        > **Note:** Creating an Issue is **required** before opening a Pull Request for Core Solution fixes (`src/`, `.github/`).
  - type: dropdown
    id: area
    attributes:
      label: Affected Subsystem
      options:
        - "CLI — Interactive 2-Step TUI (src/ui/ & skillops add / remove)"
        - "Transpiler — 28 AI IDEs & CLIs Adapter (src/sync/adapters.ts)"
        - "Lockfile — SHA-256 Drift Guard (.skillops-lock.json)"
        - "Catalog Parser & Schema Validation (src/auditor/ & src/models.ts)"
        - "Catalog Entry — Skill (catalog/<track>/<skill>/SKILL.md)"
        - "Catalog Entry — Subagent (catalog/subagents/<name>/SUBAGENT.md)"
        - "Documentation / CI Workflows (.github/)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact CLI command (`npx skillops-cli add ...` or `npx skillops-cli remove ...`) and target AI IDE (`-t cursor,claude...`).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true
