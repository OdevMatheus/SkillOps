name: Bug Report
description: Report a bug or unexpected behavior in SkillOps Engine or Catalog Skills
title: "fix: "
labels: ["🐛 fix"]
body:
  - type: markdown
    attributes:
      value: |
        > ⚠️ **Privacy First:** Never include API keys, private tokens, or local machine user paths in public issues.
  - type: checkboxes
    id: search
    attributes:
      label: Existing Issues
      options:
        - label: I have searched existing issues to make sure this bug has not been reported yet.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Provide a clear and concise description of the bug in the SkillOps CLI, MCP server, or catalog skill.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue step by step?
      placeholder: |
        1. Run `skillops audit --catalog ./catalog`...
        2. Observe output / stack trace...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: AI Agent / Harness Used
      placeholder: "e.g., Claude Code, Antigravity, Cursor, OpenAI Codex CLI, GitHub Copilot"
  - type: input
    id: environment
    attributes:
      label: Python Version & OS Environment
      placeholder: "e.g., Python 3.12 / Windows 11 / macOS 15 / Ubuntu 24.04"
