name: Bug Report
description: Report a bug in the SkillOps NPX engine, hybrid skill scripts, TDD eval runner, or multi-runtime sync
title: "fix: "
labels: ["🐛 fix"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue in **SkillOps**! Please provide details below so maintainers and AI coding agents can reproduce and fix it deterministically.
  - type: dropdown
    id: area
    attributes:
      label: Affected Subsystem
      options:
        - Core Engine — Semantic Collision & Token Budget Auditor (npx skillops audit)
        - Core Engine — Repository Token Economy & Startup Tax Analyzer (npx skillops tokens)
        - Core Engine — Context-Aware Router & Bundle Compiler (npx skillops route)
        - Core Engine — Multi-Runtime Transpiler & Sync (npx skillops sync / add)
        - Core Engine — Deterministic TDD Eval Runner (npx skillops eval)
        - Core Engine — Local Stdio MCP Server (npx skillops mcp)
        - Skill & Subagent Catalog — Track 1: AI & Agentic Systems (catalog/ai-engineering/)
        - Skill & Subagent Catalog — Track 2: Python 3.12+ Backend (catalog/python-backend/)
        - Skill & Subagent Catalog — Track 3: Architecture & Quality (catalog/arch-quality/)
        - Context-Isolated Subagents (catalog/subagents/ or .github/agents/)
        - Documentation / Governance / CI Workflows (.github/)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug or contract violation.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact CLI command (`npx skillops ...` or `python catalog/.../scripts/*.py --json`) or Vitest test case that triggers the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen according to SKILL_CONTRACT.md or AGENTS.md?
    validations:
      required: true
