name: "🤖 AI IDE Adapter or Skill/Subagent Behavior Issue"
description: "Report an output format mismatch in one of the 28 supported AI IDEs/CLIs or suggest an adjustment to an existing Skill/Subagent"
title: "fix(sync): "
labels: ["⚠️ agent-behavior", "🔄 multi-runtime"]
body:
  - type: dropdown
    id: target_agent
    attributes:
      label: Target AI IDE / CLI or Catalog Item
      options:
        - "Cursor (.cursor/rules/*.mdc)"
        - "Claude Code (.claude/skills/ & .claude/agents/)"
        - "GitHub Copilot (.github/instructions/ & .github/agents/)"
        - "Google Antigravity (.agent/skills/ & .agent/agents/)"
        - "Google Gemini CLI (.gemini/skills/ & .gemini/agents/)"
        - "OpenAI Codex CLI (.codex/skills/ & AGENTS.md)"
        - "Windsurf / Cline / Roo Code / Kilo Code"
        - "Zed / Continue / Aider / AWS Kiro / Trae / Augment"
        - "Other Supported Target (Factory, Qwen, OpenCode, OpenHands, Amp, Goose, Warp, Crush, Vibe, Junie, Amazon Q, IDX)"
        - "Existing Catalog Skill or Subagent (catalog/)"
    validations:
      required: true
  - type: textarea
    id: current_behavior
    attributes:
      label: Observed Behavior
      description: How does the generated file or prompt behave in the target AI IDE or CLI?
    validations:
      required: true
  - type: textarea
    id: desired_behavior
    attributes:
      label: Expected Vendor Specification or Prompt Adjustment
      description: Link to official vendor docs or describe the frontmatter/path adjustment needed.
    validations:
      required: true
