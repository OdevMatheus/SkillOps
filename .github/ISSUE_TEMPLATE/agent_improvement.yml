name: AI Agent Behavior, Skill Routing or Subagent Improvement
description: Report routing collisions, token budget bloat, or prompt improvements for AGENTS.md, SKILL.md, or .github/agents/
title: "docs(agents): "
labels: ["⚠️ agent-behavior", "📄 docs"]
body:
  - type: dropdown
    id: target_agent
    attributes:
      label: Target AI Harness, Subagent or Skill Layer
      options:
        - All Harnesses (AGENTS.md / SKILL_CONTRACT.md)
        - Antigravity / Gemini CLI (GEMINI.md / .agent/skills/)
        - Claude Code (CLAUDE.md / .claude/skills/)
        - Cursor (.cursor/rules/*.mdc)
        - OpenAI Codex CLI (.codex/skills/)
        - GitHub Copilot (.github/copilot-instructions.md)
        - Specialized Subagent (.github/agents/*.agent.md)
        - Catalog Hybrid Skill (catalog/<track>/<skill>/SKILL.md)
    validations:
      required: true
  - type: textarea
    id: current_behavior
    attributes:
      label: Observed Agent Failure Mode or Routing Collision
      description: How is the AI agent misrouting, colliding between skills, or wasting context window tokens?
    validations:
      required: true
  - type: textarea
    id: desired_behavior
    attributes:
      label: Proposed Trigger Boundary or Prompt Adjustment
      description: What explicit trigger (`Use when...`), negative boundary (`Do not trigger for...`), or deterministic script change resolves this?
    validations:
      required: true
