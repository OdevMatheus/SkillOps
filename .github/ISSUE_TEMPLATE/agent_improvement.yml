name: AI Agent Behavior, Skill Routing or Subagent Improvement
description: Report routing collisions, Startup Token Tax bloat, or prompt improvements for AGENTS.md, SKILL.md, or Subagents
title: "docs(agents): "
labels: ["⚠️ agent-behavior", "📄 docs"]
body:
  - type: dropdown
    id: target_agent
    attributes:
      label: Target AI Harness, Subagent or Skill Layer
      options:
        - All Harnesses (AGENTS.md / SKILL_CONTRACT.md)
        - Antigravity / Gemini CLI (GEMINI.md / .agent/skills/ / .agent/agents/)
        - Claude Code (CLAUDE.md / .claude/skills/ / .claude/agents/)
        - Cursor (.cursor/rules/*.mdc)
        - OpenAI Codex CLI (.codex/skills/ / .codex/agents/)
        - GitHub Copilot (.github/copilot-instructions.md / .github/agents/*.agent.md)
        - Catalog Hybrid Skill (catalog/<track>/<skill>/SKILL.md)
        - Catalog Context-Isolated Subagent (catalog/subagents/<name>/AGENT.md)
    validations:
      required: true
  - type: textarea
    id: current_behavior
    attributes:
      label: Observed Agent Failure Mode or Routing Collision
      description: How is the AI agent misrouting, colliding between skills, or wasting context window tokens (`npx skillops tokens` / `npx skillops audit`)?
    validations:
      required: true
  - type: textarea
    id: desired_behavior
    attributes:
      label: Proposed Trigger Boundary or Prompt Adjustment
      description: What explicit trigger (`Use when...`), negative boundary (`Do not trigger for...`), subagent token cap (`max_output_tokens <= 400`), or deterministic script change resolves this?
    validations:
      required: true
