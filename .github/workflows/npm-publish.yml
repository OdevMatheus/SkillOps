name: Publish to NPM (skillops-cli)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Build, Verify & Publish skillops-cli to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22 with NPM Registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Lint, Typecheck, Test & Build
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Verify CLI Entrypoint
        run: |
          node dist/cli.js --version
          node dist/cli.js --help

      - name: Verify Catalog Layout & Security Before Publish
        run: |
          node -e "import('./dist/index.js').then((m)=>{if(m.parseCatalogSkills){m.parseCatalogSkills('./catalog',{requireLayout:false});}else{for(const d of m.discoverSkillDirectories('./catalog')){m.parseSkillDirectory(d,{requireLayout:false});}}const r=m.auditCatalogSecurity('./catalog');if(!r.passed){console.error(r.findings);process.exit(1);}})"

      - name: Publish skillops-cli to NPM with Provenance
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
