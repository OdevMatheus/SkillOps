name: SkillOps AI Engine & Catalog CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  agent-and-skill-contract-gate:
    name: Audit Subagents & Hybrid Skill Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Subagents Frontmatter (catalog/subagents/**/SUBAGENT.md)
        run: |
          FOUND_SUBAGENTS=0
          while IFS= read -r -d '' agent_file; do
            FOUND_SUBAGENTS=1
            head -n 1 "$agent_file" | grep -q "^---$" || {
              echo "::error::Missing YAML frontmatter start in $agent_file"
              exit 1
            }
            grep -q "^name:" "$agent_file" || {
              echo "::error::Missing 'name:' field in $agent_file"
              exit 1
            }
            grep -q "^description:" "$agent_file" || {
              echo "::error::Missing 'description:' field in $agent_file"
              exit 1
            }
          done < <(find catalog/subagents -name "SUBAGENT.md" -print0)
          if [ "$FOUND_SUBAGENTS" -eq 0 ]; then
            echo "::error::No subagent definitions found in catalog/subagents/"
            exit 1
          fi
          echo "OK — All catalog/subagents/**/SUBAGENT.md definitions passed frontmatter audit."

      - name: Validate Catalog Skill Line Budgets (INV-SKILL-01 <= 250 lines)
        run: |
          if [ -d "catalog" ]; then
            while IFS= read -r -d '' skill_file; do
              LINE_COUNT=$(wc -l < "$skill_file")
              if [ "$LINE_COUNT" -gt 250 ]; then
                echo "::error file=$skill_file::SKILL.md exceeds Level 2 progressive disclosure budget ($LINE_COUNT > 250 lines)."
                exit 1
              fi
            done < <(find catalog -name "SKILL.md" -print0)
            echo "OK — All catalog SKILL.md files respect INV-SKILL-01 (<= 250 lines)."
          else
            echo "OK — Catalog directory not yet populated (pre-development readiness phase)."
          fi

      - name: Audit Catalog Python Scripts via AST Security Gate
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys

          FORBIDDEN_IMPORTS = {
              "urllib", "urllib2", "urllib3", "http", "httplib", "socket",
              "socketserver", "requests", "httpx", "aiohttp", "ftplib",
              "smtplib", "telnetlib", "xmlrpc", "webbrowser", "paramiko",
              "websocket", "websockets", "pickle", "cPickle", "marshal",
              "shelve", "ctypes", "cffi", "pty", "commands",
          }
          FORBIDDEN_CALLS = {"eval", "exec", "compile", "__import__"}
          FORBIDDEN_OS_ATTRS = {"system", "popen", "spawnl", "spawnle", "spawnlp", "spawnlpe", "spawnv", "spawnve", "spawnvp", "spawnvpe", "execl", "execle", "execlp", "execlpe", "execv", "execve", "execvp", "execvpe"}

          errors = []
          for py_file in sorted(pathlib.Path("catalog").rglob("*.py")):
              source = py_file.read_text(encoding="utf-8")
              tree = ast.parse(source, filename=py_file.as_posix())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          root = alias.name.split(".")[0]
                          if root in FORBIDDEN_IMPORTS:
                              errors.append(f"{py_file.as_posix()}:{node.lineno}: forbidden import '{root}'")
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      root = node.module.split(".")[0]
                      if root in FORBIDDEN_IMPORTS:
                          errors.append(f"{py_file.as_posix()}:{node.lineno}: forbidden from-import '{root}'")
                  elif isinstance(node, ast.Call):
                      if isinstance(node.func, ast.Name) and node.func.id in FORBIDDEN_CALLS:
                          errors.append(f"{py_file.as_posix()}:{node.lineno}: forbidden dynamic call '{node.func.id}()'")
                      elif isinstance(node.func, ast.Attribute) and isinstance(node.func.value, ast.Name) and node.func.value.id == "os" and node.func.attr in FORBIDDEN_OS_ATTRS:
                          errors.append(f"{py_file.as_posix()}:{node.lineno}: forbidden shell call 'os.{node.func.attr}()'")
                      for kw in node.keywords:
                          if kw.arg == "shell" and isinstance(kw.value, ast.Constant) and kw.value.value is True:
                              errors.append(f"{py_file.as_posix()}:{node.lineno}: forbidden 'shell=True' in subprocess call")

          if errors:
              for err in errors:
                  print(f"::error::{err}")
              sys.exit(1)
          print("OK — All catalog Python scripts passed AST security audit.")
          PY

  npx-engine-qa:
    name: Node.js ${{ matrix.node-version }} NPX Engine & TypeScript QA Gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Run TypeScript Lint, Typecheck, Vitest & Build
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          node dist/cli.js --version
          node dist/cli.js --help
