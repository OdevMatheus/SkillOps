name: SkillOps AI Engine & Catalog CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  agent-and-skill-contract-gate:
    name: Audit Subagents & Hybrid Skill Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Subagents Frontmatter (catalog/subagents/**/SUBAGENT.md)
        run: |
          FOUND_SUBAGENTS=0
          while IFS= read -r -d '' agent_file; do
            FOUND_SUBAGENTS=1
            head -n 1 "$agent_file" | grep -q "^---$" || {
              echo "::error::Missing YAML frontmatter start in $agent_file"
              exit 1
            }
            grep -q "^name:" "$agent_file" || {
              echo "::error::Missing 'name:' field in $agent_file"
              exit 1
            }
            grep -q "^description:" "$agent_file" || {
              echo "::error::Missing 'description:' field in $agent_file"
              exit 1
            }
          done < <(find catalog/subagents -name "SUBAGENT.md" -print0)
          if [ "$FOUND_SUBAGENTS" -eq 0 ]; then
            echo "::error::No subagent definitions found in catalog/subagents/"
            exit 1
          fi
          echo "OK — All catalog/subagents/**/SUBAGENT.md definitions passed frontmatter audit."

      - name: Validate Catalog Skill Line Budgets (INV-SKILL-01 <= 250 lines)
        run: |
          if [ -d "catalog" ]; then
            while IFS= read -r -d '' skill_file; do
              LINE_COUNT=$(wc -l < "$skill_file")
              if [ "$LINE_COUNT" -gt 250 ]; then
                echo "::error file=$skill_file::SKILL.md exceeds Level 2 progressive disclosure budget ($LINE_COUNT > 250 lines)."
                exit 1
              fi
            done < <(find catalog -name "SKILL.md" -print0)
            echo "OK — All catalog SKILL.md files respect INV-SKILL-01 (<= 250 lines)."
          else
            echo "OK — Catalog directory not yet populated (pre-development readiness phase)."
          fi

      - name: Audit Catalog Scripts, Trojan-Source Unicode & Boundary Guards
        run: |
          python3 - <<'PY'
          import ast, hashlib, json, pathlib, re, sys

          FORBIDDEN_ROOT_IMPORTS = {
              "urllib2", "urllib3", "httplib", "socket", "socketserver",
              "requests", "httpx", "aiohttp", "ftplib", "smtplib",
              "telnetlib", "paramiko", "websocket", "websockets",
              "pickle", "cPickle", "marshal", "shelve", "ctypes", "cffi",
              "importlib", "builtins", "pty", "commands",
          }
          FORBIDDEN_SUBMODULES = {
              "urllib.request", "urllib.urlopen", "http.client", "xmlrpc.client",
          }
          FORBIDDEN_CALLS = {"eval", "exec", "__import__"}
          FORBIDDEN_OS_ATTRS = {
              "system", "popen", "spawnl", "spawnle", "spawnlp", "spawnlpe",
              "spawnv", "spawnve", "spawnvp", "spawnvpe", "execl", "execle",
              "execlp", "execlpe", "execv", "execve", "execvp", "execvpe",
          }
          FORBIDDEN_BINARY_EXTS = {
              ".exe", ".dll", ".so", ".dylib", ".bin", ".wasm", ".pyc", ".pyo",
              ".pyd", ".msi", ".scr", ".com", ".jar", ".class", ".zip", ".tar",
              ".gz", ".tgz", ".7z", ".rar", ".bz2", ".xz",
          }
          SKIP_MEDIA_EXTS = {
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".bmp",
              ".pdf", ".woff", ".woff2", ".ttf", ".otf", ".eot",
          }
          TROJAN_BIDI_RE = re.compile(r"[\u0000\u061C\u200E\u200F\u202A-\u202E\u2066-\u2069\uFEFF\U000E0000-\U000E007F]")

          allowlist_path = pathlib.Path(".skillops-security-allowlist.json")
          allowlist_entries = []
          if allowlist_path.is_file():
              allowlist_data = json.loads(allowlist_path.read_text(encoding="utf-8"))
              allowlist_entries = allowlist_data.get("exceptions", [])

          def is_allowlisted(rel_posix: str, digest: str) -> bool:
              for entry in allowlist_entries:
                  if entry.get("relative_path") == rel_posix and entry.get("sha256") == digest:
                      return True
              return False

          errors = []
          catalog_root = pathlib.Path("catalog")

          for item in sorted(catalog_root.rglob("*")):
              if "__pycache__" in item.parts:
                  continue
              if item.is_symlink():
                  errors.append(f"{item.as_posix()}:1: forbidden symbolic link in catalog")
                  continue
              if item.is_file():
                  low = item.name.lower()
                  if low.endswith(".tar.gz") or item.suffix.lower() in FORBIDDEN_BINARY_EXTS:
                      errors.append(f"{item.as_posix()}:1: forbidden binary or archive file '{item.name}'")
                      continue
                  if item.suffix.lower() in SKIP_MEDIA_EXTS:
                      continue
                  raw_bytes = item.read_bytes()
                  digest = hashlib.sha256(raw_bytes).hexdigest()
                  if is_allowlisted(item.as_posix(), digest):
                      continue
                  try:
                      txt = raw_bytes.decode("utf-8")
                  except UnicodeDecodeError:
                      continue
                  if txt.startswith("\ufeff"):
                      txt = txt[1:]
                  for idx, line in enumerate(txt.splitlines(), 1):
                      if len(line) > 4096:
                          errors.append(f"{item.as_posix()}:{idx}: suspicious long line ({len(line)} > 4096)")
                          continue
                      m = TROJAN_BIDI_RE.search(line)
                      if m:
                          cp = f"U+{ord(m.group(0)):04X}"
                          errors.append(f"{item.as_posix()}:{idx}: forbidden Trojan-Source / invisible control character {cp}")

          for py_file in sorted(catalog_root.rglob("*.py")):
              if "__pycache__" in py_file.parts:
                  continue
              raw_bytes = py_file.read_bytes()
              digest = hashlib.sha256(raw_bytes).hexdigest()
              if is_allowlisted(py_file.as_posix(), digest):
                  continue
              source = raw_bytes.decode("utf-8")
              tree = ast.parse(source, filename=py_file.as_posix())
              for node in ast.walk(tree):
                  lineno = getattr(node, "lineno", 1)
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          root = alias.name.split(".")[0]
                          first_two = ".".join(alias.name.split(".")[:2])
                          if root in FORBIDDEN_ROOT_IMPORTS:
                              errors.append(f"{py_file.as_posix()}:{lineno}: forbidden import '{root}'")
                          elif first_two in FORBIDDEN_SUBMODULES:
                              errors.append(f"{py_file.as_posix()}:{lineno}: forbidden network client '{first_two}'")
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      root = node.module.split(".")[0]
                      first_two = ".".join(node.module.split(".")[:2])
                      imported = {a.name for a in node.names}
                      if root in FORBIDDEN_ROOT_IMPORTS:
                          errors.append(f"{py_file.as_posix()}:{lineno}: forbidden from-import '{root}'")
                      elif first_two in FORBIDDEN_SUBMODULES:
                          errors.append(f"{py_file.as_posix()}:{lineno}: forbidden network client '{first_two}'")
                      elif node.module == "urllib" and (imported & {"request", "urlopen"}):
                          errors.append(f"{py_file.as_posix()}:{lineno}: forbidden network client 'urllib.request'")
                      elif node.module in {"http", "xmlrpc"} and "client" in imported:
                          errors.append(f"{py_file.as_posix()}:{lineno}: forbidden network client '{node.module}.client'")
                  elif isinstance(node, ast.Call):
                      if isinstance(node.func, ast.Name):
                          fn_name = node.func.id
                          if fn_name in FORBIDDEN_CALLS:
                              errors.append(f"{py_file.as_posix()}:{lineno}: forbidden dynamic call '{fn_name}()'")
                          elif fn_name == "compile" and (len(node.args) >= 3 or any(kw.arg == "mode" for kw in node.keywords)):
                              errors.append(f"{py_file.as_posix()}:{lineno}: forbidden dynamic compilation 'compile()'")
                          elif fn_name == "getattr" and node.args and isinstance(node.args[0], ast.Name) and node.args[0].id in {"__builtins__", "builtins"}:
                              errors.append(f"{py_file.as_posix()}:{lineno}: forbidden builtins lookup 'getattr({node.args[0].id}, ...)'")
                      elif isinstance(node.func, ast.Attribute) and isinstance(node.func.value, ast.Name) and node.func.value.id == "os" and node.func.attr in FORBIDDEN_OS_ATTRS:
                          errors.append(f"{py_file.as_posix()}:{lineno}: forbidden shell call 'os.{node.func.attr}()'")
                      for kw in node.keywords:
                          if kw.arg == "shell" and isinstance(kw.value, ast.Constant) and kw.value.value is True:
                              errors.append(f"{py_file.as_posix()}:{lineno}: forbidden 'shell=True' in subprocess call")

          if errors:
              for err in errors:
                  print(f"::error::{err}")
              sys.exit(1)
          print("OK — All catalog files and Python scripts passed AST, Trojan-Source, and boundary security audit.")
          PY

  npx-engine-qa:
    name: Node.js ${{ matrix.node-version }} NPX Engine & TypeScript QA Gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Run TypeScript Lint, Typecheck, Vitest & Build
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          node dist/cli.js --version
          node dist/cli.js --help
