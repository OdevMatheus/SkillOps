name: SkillOps AI Engine & Catalog CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  agent-and-skill-contract-gate:
    name: Audit Subagents & Hybrid Skill Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Subagents Frontmatter (.github/agents/*.agent.md)
        run: |
          for agent_file in .github/agents/*.agent.md; do
            if [ ! -f "$agent_file" ]; then
              echo "::error::No subagent definitions found in .github/agents/"
              exit 1
            fi
            head -n 1 "$agent_file" | grep -q "^---$" || {
              echo "::error::Missing YAML frontmatter start in $agent_file"
              exit 1
            }
            grep -q "^name:" "$agent_file" || {
              echo "::error::Missing 'name:' field in $agent_file"
              exit 1
            }
            grep -q "^description:" "$agent_file" || {
              echo "::error::Missing 'description:' field in $agent_file"
              exit 1
            }
          done
          echo "OK — All .github/agents/*.agent.md definitions passed frontmatter audit."

      - name: Validate Catalog Skill Line Budgets (INV-SKILL-01 <= 250 lines)
        run: |
          if [ -d "catalog" ]; then
            while IFS= read -r -d '' skill_file; do
              LINE_COUNT=$(wc -l < "$skill_file")
              if [ "$LINE_COUNT" -gt 250 ]; then
                echo "::error file=$skill_file::SKILL.md exceeds Level 2 progressive disclosure budget ($LINE_COUNT > 250 lines)."
                exit 1
              fi
            done < <(find catalog -name "SKILL.md" -print0)
            echo "OK — All catalog SKILL.md files respect INV-SKILL-01 (<= 250 lines)."
          else
            echo "OK — Catalog directory not yet populated (pre-development readiness phase)."
          fi

  npx-engine-qa:
    name: Node.js ${{ matrix.node-version }} NPX Engine & TypeScript QA Gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Run TypeScript Lint, Typecheck, Vitest, Build & NPX Audit/Tokens/Eval Gate
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          node dist/cli.js audit --catalog catalog --strict --require-layout
          node dist/cli.js tokens --strict
          node dist/cli.js eval --catalog catalog --strict
