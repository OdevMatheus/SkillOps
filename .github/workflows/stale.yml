name: Close Stale Issues and PRs

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-message: "This issue has been automatically marked as stale due to 45 days of inactivity. It will be closed in 14 days if no further activity occurs."
          stale-pr-message: "This pull request has been automatically marked as stale due to 45 days of inactivity. It will be closed in 14 days if no further activity occurs."
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,roadmap"
          exempt-pr-labels: "pinned,security,work-in-progress"
