name: PR Governance & Hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  governance-check:
    name: Validate Branch, Semantic Title & Data Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Naming & Semantic PR Title
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            const title = pr.title;

            // 1. Validate branch name: <type>/<short-kebab-description>
            const branchRegex = /^(feat|fix|docs|chore|refactor|test|style|perf|ci)\/[a-z0-9-]+$/;
            if (!branchRegex.test(branch)) {
              core.setFailed(
                `Invalid branch name "${branch}". Branch must follow "<type>/<short-kebab-description>" ` +
                `(e.g., "chore/initial-setup", "feat/onboarding-mode", "docs/agent-rules").`
              );
            }

            // 2. Validate PR title follows Conventional Commits in en-US
            const titleRegex = /^(feat|fix|docs|chore|refactor|test|style|perf|ci)(\([a-z0-9-]+\))?!?: [a-z].+$/;
            if (!titleRegex.test(title)) {
              core.setFailed(
                `Invalid PR title "${title}". Title must follow Conventional Commits in lowercase imperative ` +
                `(e.g., "chore(repo): initialize base AI agent files").`
              );
            }

            core.info(`Branch "${branch}" and PR title "${title}" passed governance validation.`);

      - name: Block Local Developer Docs (DOCS-DEV) & Sensitive Files
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const FORBIDDEN_PATTERNS = [
              /^DOCS-DEV\//i,
              /^\.env(\..+)?$/,
            ];

            const offending = files
              .filter((f) => f.status !== 'removed' && f.filename !== '.env.example')
              .map((f) => f.filename)
              .filter((name) => FORBIDDEN_PATTERNS.some((re) => re.test(name)));

            if (offending.length > 0) {
              core.setFailed(
                `This PR includes local-only or sensitive files that must remain gitignored:\n  - ` +
                offending.join('\n  - ')
              );
            } else {
              core.info('OK — no DOCS-DEV/ or sensitive files detected in PR.');
            }
