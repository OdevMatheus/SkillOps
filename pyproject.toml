[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "skillops"
version = "0.2.0"
description = "The Zero-API Python 3.12+ Engine & Benchmark-Verified Library for AI Coding Agent Skills & Subagents."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "OdevMatheus", email = "matheusvita007@gmail.com" },
]
keywords = [
  "ai-agents",
  "agent-skills",
  "subagents",
  "mcp",
  "mcp-stdio",
  "ast-analysis",
  "zero-api",
  "offline-first",
  "claude-code",
  "cursor",
  "codex",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.9.0",
  "typer>=0.12.0",
  "rich>=13.9.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-PyYAML>=6.0.12",
]

[project.urls]
Homepage = "https://github.com/OdevMatheus/SkillOps"
Repository = "https://github.com/OdevMatheus/SkillOps.git"
Issues = "https://github.com/OdevMatheus/SkillOps/issues"
Changelog = "https://github.com/OdevMatheus/SkillOps/blob/master/CHANGELOG.md"

[project.scripts]
skillops = "skillops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skillops"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "C4",
  "UP",
  "SIM",
  "TCH",
  "RUF",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = "src"
packages = ["skillops", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers"

[tool.coverage.run]
source = ["skillops"]
branch = true
omit = ["src/skillops/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90
