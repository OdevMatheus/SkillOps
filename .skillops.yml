# SkillOps Workspace Configuration (.skillops.yml)
# Validated by src/models.ts (SkillOpsConfigSchema) via `npx skillops@latest`
schema_version: "1.0"
catalog_dir: "catalog"
max_bundle_size: 12
collision_warning_threshold: 0.72
collision_error_threshold: 0.85
target_runtimes:
  - "claude"
  - "antigravity"
  - "cursor"
  - "codex"
  - "copilot"
